<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Platform</title>
  <style>
    :root {
      --primary: #007bff;
      --secondary: #6c757d;
      --background: #f5f7fa;
      --card-bg: #ffffff;
      --text: #333333;
      --text-light: #666666;
      --border: #e0e0e0;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      --gradient-no-media: linear-gradient(135deg, #f0f0f0, #e0e0e0);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--background);
      color: var(--text);
      line-height: 1.5;
      overscroll-behavior: none;
    }

    body.modal-open {
      overflow: hidden;
      position: fixed;
      width: 100%;
    }

    nav {
      background: var(--card-bg);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--primary);
    }

    .notification-container {
      position: relative;
      margin-left: auto;
    }

    .notif-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
    }

    .notif-count {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      padding: 2px 6px;
      font-size: 0.75rem;
      display: none;
    }

    .notif-list {
      display: none;
      position: absolute;
      top: 2.5rem;
      right: 0;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--shadow);
      width: 300px;
      max-height: 400px;
      overflow-y: auto;
      z-index: 1000;
    }

    .notif-list .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .notif-item {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s;
    }

    .notif-item.unread {
      background: #e8f0fe;
    }

    .notif-item:hover {
      background: #f8f8f8;
    }

    .container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      position: relative;
    }

    .pull-refresh {
      position: absolute;
      top: -50px;
      left: 0;
      width: 100%;
      text-align: center;
      background: var(--card-bg);
      padding: 10px;
      transition: top 0.3s;
      z-index: 500;
    }

    .spinner {
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-left-color: var(--primary);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .stories {
      display: flex;
      overflow-x: auto;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 0.5rem 0;
    }

    .story-item {
      width: 80px;
      height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    .story-image-container {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      overflow: hidden;
      margin-bottom: 5px;
    }

    .story-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .story-username {
      font-size: 0.7rem;
      text-align: center;
      max-width: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .story-timestamp {
      font-size: 0.6rem;
      color: var(--text-light);
      margin-top: 2px;
    }

    .story-add {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      margin-bottom: 5px;
    }

    .story-reactions {
      display: none;
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      border-radius: 20px;
      padding: 5px;
      box-shadow: var(--shadow);
      z-index: 1000;
    }

    .story-reactions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      padding: 5px;
      cursor: pointer;
    }

    .story-viewers-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      padding: 1rem;
    }

    .story-viewers-card {
      background: var(--card-bg);
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .story-viewers-list div {
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .post-box {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }

    .post-box h3 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }

    .post-box textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      resize: none;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .color-palette {
      display: flex;
      gap: 0.5rem;
      margin: 1rem 0;
    }

    .color-option {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .color-option.selected {
      transform: scale(1.2);
      border: 2px solid var(--primary);
    }

    .post-box input[type="file"],
    .post-box input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 0.5rem 0;
    }

    .post-box button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .post-box button:hover {
      background: #0056b3;
    }

    .post-box button:disabled {
      background: var(--secondary);
      cursor: not-allowed;
    }

    .feed-post {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }

    .feed-post .user {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .feed-post .user a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text);
    }

    .feed-post .user img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .text-post {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      cursor: pointer;
      text-align: center;
    }

    .media-wrapper {
      margin-bottom: 1rem;
      cursor: pointer;
    }

    .feed-post img,
    .feed-post video {
      max-width: 100%;
      border-radius: 8px;
    }

    .media-caption {
      font-size: 0.875rem;
      color: var(--text-light);
      margin-bottom: 1rem;
    }

    .actions {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .actions button {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .actions button:hover {
      color: var(--primary);
    }

    .comments-section {
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .comments-header {
      margin-bottom: 1rem;
    }

    .comments-list .comment {
      margin-bottom: 1rem;
    }

    .comment .meta {
      font-size: 0.875rem;
      color: var(--text-light);
    }

    .reply {
      margin-left: 2rem;
      margin-top: 0.5rem;
    }

    .reply-btn {
      font-size: 0.875rem;
      color: var(--text-light);
      background: none;
      border: none;
      cursor: pointer;
    }

    .reply-btn:hover {
      color: var(--primary);
    }

    .comment-input,
    .reply-input-area {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .comment-input input,
    .reply-input-area input {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .comment-input button,
    .reply-input-area button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      padding: 1rem;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      color: var(--text-light);
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-header img {
      width: 32px; /* Reduced from 40px */
      height: 32px; /* Reduced from 40px */
      border-radius: 6px; /* Reduced from 50% */
      object-fit: cover;
    }

    .modal-content {
      padding: 1.5rem;
    }

    .modal-media-section {
      max-height: 100px;
      overflow: hidden;
      transition: max-height 0.3s;
      cursor: pointer;
    }

    .modal-media-section.full-size {
      max-height: none;
    }

    .modal-media-section img,
    .modal-media-section video {
      max-width: 100%;
      max-height: 100px;
      border-radius: 8px;
      transition: max-height 0.3s;
    }

    .modal-media-section.full-size img,
    .modal-media-section.full-size video {
      max-height: none;
    }

    .no-media-placeholder {
      padding: 1rem;
      text-align: center;
      color: var(--text-light);
      background: var(--gradient-no-media);
      border-radius: 8px;
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
      padding: 1rem 0;
      border-top: 1px solid var(--border);
    }

    .modal-actions button {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .modal-actions button:hover {
      color: var(--primary);
    }

    .modal-comments-section {
      padding: 1rem 0;
    }

    .modal-comment-input {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .modal-comment-input input {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .modal-comment-input button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .zoom-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 3000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .zoom-controls {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 1rem;
    }

    .zoom-controls a,
    .zoom-controls button {
      background: rgba(255, 255, 255, 0.12);
      color: white;
      padding: 0.5rem;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .zoom-overlay img,
    .zoom-overlay video {
      max-width: 90%;
      max-height: 70%;
    }

    .zoom-reactions {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    .zoom-reactions button {
      font-size: 2rem;
      background: none;
      border: none;
      cursor: pointer;
    }

    .story-progress {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      height: 3px;
      background: rgba(255,255,255,0.3);
      z-index: 10;
    }

    .story-progress-bar {
      height: 100%;
      background: white;
      width: 0;
      transition: width linear;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      padding: 10px;
      font-size: 2rem;
      cursor: pointer;
    }

    .left-arrow {
      left: 10px;
    }

    .right-arrow {
      right: 10px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-light);
      padding: 1rem;
    }

    #sentinel {
      height: 1px;
      margin: 1rem 0;
      text-align: center;
      color: var(--text-light);
    }

    @media (max-width: 600px) {
      .container {
        margin: 1rem;
      }

      .notif-list {
        width: 90vw;
      }
      
      
      .viewers-button {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s;
    }

    .viewers-button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .viewers-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 3000;
      justify-content: center;
      align-items: center;
    }

    .viewers-modal-content {
      background: white;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .viewers-modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .viewers-modal-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .viewers-modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #666;
    }

    .viewers-list {
      max-height: 60vh;
      overflow-y: auto;
    }

    .viewer-item {
      display: flex;
      align-items: center;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
    }

    .viewer-item:last-child {
      border-bottom: none;
    }

    .viewer-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }

    .viewer-info {
      flex: 1;
    }

    .viewer-name {
      font-weight: 500;
      margin-bottom: 4px;
    }

    .viewer-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #666;
    }

    .viewer-reaction {
      font-size: 1rem;
    }

    .viewers-count {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.8rem;
      margin-left: 5px;
    }

    .no-viewers {
      padding: 2rem;
      text-align: center;
      color: #666;
    }

    /* Add to existing zoom-overlay styles */
    .zoom-overlay .viewers-section {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

      .modal-card {
        max-height: 95vh;
      }
      
    }
  </style>
</head>
<body>
  <nav>
    <a href="home2.html" class="active"><span>🏠</span><span>Home</span></a>
    <a href="matchs.html"><span>💞</span><span>Match</span></a>
    <a href="date.html">👫 L💕Zone💘</a>  
    <a href="chats.html"><span>💬</span><span>Chats</span><span class="nav-notif-dot" id="navNotifDot"></span></a>
    <a href="profile.html"><span>👤</span><span>Profile</span></a>
    
    <div class="notification-container" id="notificationContainer">
      <button id="notifBtn" class="notif-btn">🔔
        <span id="notifCount" class="notif-count">0</span>
      </button>
      <div id="notifList" class="notif-list" aria-hidden="true">
        <div class="header">
          <strong>Notifications</strong>
          <div>
            <button id="closeNotifBtn">Close</button>
            <button id="deleteAllNotifBtn">Clear All</button>
          </div>
        </div>
        <div id="notifItems">
          <p>No notifications yet</p>
        </div>
      </div>
    </div>
  </nav>

  <div class="container" id="container">
    <div class="pull-refresh" id="pullRefresh">
      <div class="spinner"></div>
    </div>
    <div class="stories" id="stories">
      <div class="story-add" onclick="uploadStory()">+</div>
    </div>
    <input type="file" id="storyImage" accept="image/*,video/*" style="display:none;">
    <div class="post-box create-post">
      <h3>Create a post</h3>
      <textarea id="postText" rows="3" placeholder="What's on your mind?"></textarea>
      <div class="color-palette" id="colorPalette">
        <div class="color-option" data-color="#ffffff" style="background:#ffffff;border:1px solid #e0e0e0;"></div>
        <div class="color-option" data-color="#ffebee" style="background:#ffebee;"></div>
        <div class="color-option" data-color="#e8f5e8" style="background:#e8f5e8;"></div>
        <div class="color-option" data-color="#e3f2fd" style="background:#e3f2fd;"></div>
        <div class="color-option" data-color="#fff3e0" style="background:#fff3e0;"></div>
        <div class="color-option" data-color="#f3e5f5" style="background:#f3e5f5;"></div>
      </div>
      <div>
        <input id="postImage" type="file" accept="image/*,video/*">
        <input type="text" id="mediaCaption" placeholder="Add a caption for your media..." style="display:none;">
        <div id="uploadIndicator" style="display:none;color:var(--primary);">Uploading media...</div>
      </div>
      <button id="postBtn">Post</button>
    </div>

    <div id="feed">
      <div class="loading">Loading posts...</div>
    </div>
    <div id="sentinel">Loading more posts...</div>
  </div>

  <div id="postModalBackdrop" class="modal-backdrop" role="dialog" aria-hidden="true">
    <div class="modal-card" id="modalCard" role="document">
      <button id="closePostModal" class="close-modal" title="Close">✕</button>
      <div class="modal-header">
        <img id="modalAuthorPhoto" src="" alt="author">
        <div>
          <div id="modalAuthorName"></div>
          <div id="modalTime" class="small"></div>
        </div>
        <button id="viewFriendProfile" style="display:none;">View Profile</button>
      </div>
      <div class="modal-content">
        <div class="modal-details-section">
          <div id="modalText" class="modal-text-content"></div>
          <div id="modalCaption" class="media-caption" style="display:none;"></div>
        </div>
        <div class="modal-media-section" id="modalMedia">
          <div class="no-media-placeholder" style="display:none;">No media in this post</div>
        </div>
        <div class="modal-actions">
          <button id="modalLikeBtn" onclick="likePost(currentModalPostId)">
            <span>🤍</span>
            <span>Like</span>
          </button>
          <button onclick="document.getElementById('modalNewComment').focus()">
            <span>💬</span>
            <span>Comment</span>
          </button>
        </div>
        <div class="modal-comments-section">
          <div><strong>Comments</strong></div>
          <div id="modalComments" class="modal-comments">
            <div class="empty-state">Loading comments…</div>
          </div>
          <div class="modal-comment-input">
            <input id="modalNewComment" placeholder="Write a comment...">
            <button id="modalSendComment">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="viewersModal" class="viewers-modal">
    <div class="viewers-modal-content">
      <div class="viewers-modal-header">
        <div class="viewers-modal-title">Viewers</div>
        <button id="closeViewersModal" class="viewers-modal-close">×</button>
      </div>
      <div id="viewersList" class="viewers-list">
        <div class="no-viewers">No viewers yet</div>
      </div>
    </div>
  </div>

function initializeStoriesScroll() {
    const storiesContainer = document.getElementById('stories');
    if (!storiesContainer) return;

    let isDown = false;
    let startX;
    let scrollLeft;

    storiesContainer.addEventListener('mousedown', (e) => {
        isDown = true;
        storiesContainer.classList.add('active');
        startX = e.pageX - storiesContainer.offsetLeft;
        scrollLeft = storiesContainer.scrollLeft;
    });

    storiesContainer.addEventListener('mouseleave', () => {
        isDown = false;
        storiesContainer.classList.remove('active');
    });

    storiesContainer.addEventListener('mouseup', () => {
        isDown = false;
        storiesContainer.classList.remove('active');
    });

    storiesContainer.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - storiesContainer.offsetLeft;
        const walk = (x - startX) * 2;
        storiesContainer.scrollLeft = scrollLeft - walk;
    });

    // Touch events for mobile
    storiesContainer.addEventListener('touchstart', (e) => {
        isDown = true;
        startX = e.touches[0].pageX - storiesContainer.offsetLeft;
        scrollLeft = storiesContainer.scrollLeft;
    });

    storiesContainer.addEventListener('touchend', () => {
        isDown = false;
    });

    storiesContainer.addEventListener('touchmove', (e) => {
        if (!isDown) return;
        const x = e.touches[0].pageX - storiesContainer.offsetLeft;
        const walk = (x - startX) * 2;
        storiesContainer.scrollLeft = scrollLeft - walk;
    });
}

                </label>
            </div>
        </div>

    `;

    const pullRefresh = document.getElementById('pullRefresh');

function setupSearchEvents() {
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    const searchResults = document.getElementById('searchResults');
    const searchPosts = document.getElementById('searchPosts');
    const searchUsers = document.getElementById('searchUsers');
    const searchStories = document.getElementById('searchStories');

    if (!searchInput) return;

    let searchTimeout;

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.trim();
        
        if (clearSearch) {
            clearSearch.style.display = query ? 'block' : 'none';
        }

        clearTimeout(searchTimeout);

        if (query.length < 2) {
            if (searchResults) searchResults.style.display = 'none';
            document.querySelectorAll('.feed-post').forEach(post => {
                post.style.display = 'block';
            });
            return;
        }

        searchTimeout = setTimeout(() => {
            performSearch(query);
        }, 300);
    });

    if (clearSearch) {
        clearSearch.addEventListener('click', () => {
            searchInput.value = '';
            clearSearch.style.display = 'none';
            if (searchResults) searchResults.style.display = 'none';
            document.querySelectorAll('.feed-post').forEach(post => {
                post.style.display = 'block';
            });
        });
    }

    [searchPosts, searchUsers, searchStories].forEach(checkbox => {
        if (checkbox) {
            checkbox.addEventListener('change', () => {
                if (searchInput.value.trim().length >= 2) {
                    performSearch(searchInput.value.trim());
                }
            });
        }
    });

    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            searchInput.focus();
        }
    });
}

async function performSearch(query) {
    const searchResults = document.getElementById('searchResults');
    const searchPosts = document.getElementById('searchPosts')?.checked || false;
    const searchUsers = document.getElementById('searchUsers')?.checked || false;
    const searchStories = document.getElementById('searchStories')?.checked || false;

    if (!searchResults) return;

    searchResults.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--text-light);">Searching...</div>';
    searchResults.style.display = 'block';

    try {
        const results = { posts: [], users: [], stories: [] };

        document.querySelectorAll('.feed-post').forEach(post => {
            post.style.display = 'none';
        });

        // Search Posts
        if (searchPosts) {
            const postsSnapshot = await db.collection('posts').orderBy('createdAt', 'desc').get();
            postsSnapshot.forEach(doc => {
                const post = doc.data();
                const postText = post.text || '';
                const author = post.author || '';
                
                if (postText.toLowerCase().includes(query.toLowerCase()) || 
                    author.toLowerCase().includes(query.toLowerCase())) {
                    results.posts.push({ id: doc.id, ...post, type: 'post' });
                }
            });
        }

        // Search Users
        if (searchUsers) {
            const usersSnapshot = await db.collection('users').get();
            usersSnapshot.forEach(doc => {
                const user = doc.data();
                const fullName = user.fullName || '';
                const email = user.email || '';
                
                if (fullName.toLowerCase().includes(query.toLowerCase()) || 
                    email.toLowerCase().includes(query.toLowerCase())) {
                    results.users.push({ id: doc.id, ...user, type: 'user' });
                }
            });
        }

        // Search Stories
        if (searchStories) {
            const twentyFourHoursAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
            const storiesSnapshot = await db.collection('stories')
                .where('createdAt', '>', twentyFourHoursAgo).get();

            storiesSnapshot.forEach(doc => {
                const story = doc.data();
                const author = story.author || '';
                
                if (author.toLowerCase().includes(query.toLowerCase())) {
                    results.stories.push({ id: doc.id, ...story, type: 'story' });
                }
            });
        }

        displaySearchResults(results, query);
    } catch (error) {
        console.error('Search error:', error);
        searchResults.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--text-light);">Search failed. Please try again.</div>';
    }
}

          photoURL: userData.photoURL || '',

          mediaType,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()

        showToast('Story uploaded');
        storyImage.value = '';
      } catch (e) {
        console.error('story upload error', e);
        showToast('Upload failed');

    });

    async function reactToStory(storyId, reaction) {
      if (!currentUser) { showToast('Please sign in'); return; }
      try {
        const reactionRef = db.collection('stories').doc(storyId).collection('reactions').doc(currentUser.uid);
        await reactionRef.set({
          uid: currentUser.uid,
          reaction,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        const storyDoc = await db.collection('stories').doc(storyId).get();
        const storyData = storyDoc.data();
        if (storyData.uid && storyData.uid !== currentUser.uid) {
          const senderDoc = await db.collection('users').doc(currentUser.uid).get();
          await sendNotification(storyData.uid, 'story_reaction', null, senderDoc.exists ? senderDoc.data().fullName : 'Someone', null, storyId);
        }
        showToast('Reaction added');
      } catch (e) {
        console.error('react to story error', e);
        showToast('Failed to react');
      }
    }

    const viewersList = document.getElementById('viewersList');
    
    if (!viewersModal || !viewersList) {
        console.error('Viewers modal elements not found');
        return;
    }
    
    viewersList.innerHTML = '<div class="no-viewers">Loading viewers...</div>';
    viewersModal.style.display = 'flex';
    
    try {
        // First, get the story to check ownership
        const storyDoc = await db.collection('stories').doc(storyId).get();
        if (!storyDoc.exists) {
            viewersList.innerHTML = '<div class="no-viewers">Story not found</div>';
            return;
        }
        
        const storyData = storyDoc.data();
        
        // Check if current user owns this story
        if (storyData.uid !== currentUser.uid) {
            viewersList.innerHTML = '<div class="no-viewers">You can only view viewers for your own stories</div>';
            return;
        }
        
        const [viewersSnap, reactionsSnap] = await Promise.all([
            db.collection('stories').doc(storyId).collection('viewers').orderBy('createdAt', 'desc').get(),
            db.collection('stories').doc(storyId).collection('reactions').get()
        ]);
        
        viewersList.innerHTML = '';
        
        if (viewersSnap.empty) {
            viewersList.innerHTML = '<div class="no-viewers">No viewers yet</div>';
            return;
        }
        
        // Create a map of reactions by user ID
        const reactionsMap = {};
        reactionsSnap.forEach(doc => {
            const reaction = doc.data();
            reactionsMap[reaction.uid] = reaction.reaction;
        });
        
        // Process viewers and fetch user data
        const viewerPromises = [];
        const viewersData = [];
        
        viewersSnap.forEach(doc => {
            const viewer = doc.data();
            viewerPromises.push(
                getUserData(viewer.uid).then(userData => {
                    viewersData.push({
                        ...viewer,
                        userData: userData || {},
                        reaction: reactionsMap[viewer.uid] || ''
                    });
                }).catch(error => {
                    console.error('Error fetching user data:', error);
                    // Add viewer with minimal data
                    viewersData.push({
                        ...viewer,
                        userData: { fullName: 'User' },
                        reaction: reactionsMap[viewer.uid] || ''
                    });
                })
            );
        });
        
        await Promise.all(viewerPromises);
        
        // Create viewer list items
        viewersData.forEach(viewer => {
            const userData = viewer.userData || {};
            const viewerItem = document.createElement('div');
            viewerItem.className = 'viewer-item';
            
            const timeAgo = getTimeAgo(viewer.createdAt);
            
            viewerItem.innerHTML = `
                <img src="${userData.photoURL || 'https://via.placeholder.com/44?text=U'}" 
                     alt="${userData.fullName || 'User'}" 
                     class="viewer-avatar"
                     onerror="this.src='https://via.placeholder.com/44?text=U'">
                <div class="viewer-info">
                    <div class="viewer-name">${userData.fullName || 'User'}</div>
                    <div class="viewer-meta">
                        <span>${timeAgo}</span>
                        ${viewer.reaction ? `<span class="viewer-reaction">${viewer.reaction}</span>` : ''}
                    </div>
                </div>
            `;
            
            viewersList.appendChild(viewerItem);
        });
        
    } catch (error) {
        console.error('Error loading viewers:', error);
        viewersList.innerHTML = '<div class="no-viewers">Failed to load viewers</div>';
    }
}

        closeViewersModal(); // Also close viewers modal if open
    };
    
    controls.appendChild(downloadBtn);
    controls.appendChild(closeBtn);
    zoomOverlay.appendChild(controls);

    // Create media element
    let mediaEl;
    if (mediaType === 'image') {
        mediaEl = document.createElement('img');
        mediaEl.src = mediaUrl;
        mediaEl.alt = 'story';
        mediaEl.style.maxWidth = '90%';
        mediaEl.style.maxHeight = '70%';

        mediaEl.autoplay = true;
        mediaEl.style.maxWidth = '90%';

    // Create viewers section - ONLY show if user owns the story
    const viewersSection = document.createElement('div');
    viewersSection.className = 'viewers-section';
    
    // Check if current user owns this story
    if (currentUser && currentUser.uid === ownerId) {
        // Fetch viewers count and create viewers button
        db.collection('stories').doc(storyId).collection('viewers').get().then(snap => {
            const viewersCount = snap.size;
            
            const viewersButton = document.createElement('button');
            viewersButton.className = 'viewers-button';
            viewersButton.innerHTML = `👁️ Viewers ${viewersCount > 0 ? `<span class="viewers-count">${viewersCount}</span>` : ''}`;
            viewersButton.onclick = (e) => {
                e.stopPropagation(); // Prevent event bubbling
                openStoryViewers(storyId);
            };
            
            viewersSection.appendChild(viewersButton);
        }).catch(error => {
            console.error('Error fetching viewers count:', error);
        });
        
        zoomOverlay.appendChild(viewersSection);
    }

    // Add reactions if not owner
    if (currentUser && currentUser.uid !== ownerId) {
        const reactionsDiv = document.createElement('div');
        reactionsDiv.className = 'zoom-reactions';
        
        const reactions = ['😊', '❤️', '🔥'];
        reactions.forEach(reaction => {

            reactionBtn.style.background = 'none';
            reactionBtn.style.border = 'none';
            reactionBtn.style.fontSize = '2rem';
            reactionBtn.style.cursor = 'pointer';
            reactionBtn.onclick = (e) => {
                e.stopPropagation(); // Prevent event bubbling
                reactToStory(storyId, reaction);
            };
            
            reactionsDiv.appendChild(reactionBtn);
        });

        markStoryViewed(storyId, ownerId);
    }

    // Progress bar

    clearTimeout(autoNextTimer);
    autoNextTimer = setTimeout(() => {
        goToNext(currentIndex);

    if (currentIndex > 0) {
        const leftArrow = document.createElement('button');
        leftArrow.className = 'nav-arrow left-arrow';
        leftArrow.textContent = '◀';
        leftArrow.onclick = (e) => {
            e.stopPropagation(); // Prevent event bubbling
            goToPrev(currentIndex);

        const rightArrow = document.createElement('button');
        rightArrow.className = 'nav-arrow right-arrow';
        rightArrow.textContent = '▶';
        rightArrow.onclick = (e) => {
            e.stopPropagation(); // Prevent event bubbling
            goToNext(currentIndex);
        };

    }

    // Modified loadStories function to include usernames, timestamps, and sorting
    function loadStories() {
    const twentyFourHoursAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
    
    db.collection('stories').where('createdAt', '>', twentyFourHoursAgo).orderBy('createdAt', 'desc').onSnapshot(async snapshot => {
        // Clear stories container but keep the structure
        stories.innerHTML = '';
        
        // Always add "Your Story" first
        const yourStoryElement = document.createElement('div');
        yourStoryElement.className = 'story-item';
        yourStoryElement.innerHTML = `
            <div class="story-add" onclick="uploadStory()">
                +
            </div>
            <div class="story-username">Your Story</div>
        `;
        stories.appendChild(yourStoryElement);

        if (snapshot.empty) {
            storiesArray = [];
            return;
        }

        const tempStoriesArray = [];
        
        for (const doc of snapshot.docs) {
            const story = { id: doc.id, ...doc.data() };
            
            try {
                if (currentUser) {
                    const viewerDoc = await db.collection('stories').doc(story.id).collection('viewers').doc(currentUser.uid).get();
                    story.viewed = viewerDoc.exists;
                    
                    if (story.uid === currentUser.uid) {
                        const viewersSnap = await db.collection('stories').doc(story.id).collection('viewers').get();
                        story.viewersCount = viewersSnap.size;
                    } else {
                        story.viewersCount = 0;
                    }
                } else {
                    story.viewed = false;
                    story.viewersCount = 0;
                }
            } catch (e) {
                console.error('Error processing story:', e);
                story.viewed = false;
                story.viewersCount = 0;
            }
            
            tempStoriesArray.push(story);
        }

        // Separate user's stories and others' stories
        const userStories = [];
        const otherStories = [];
        
        tempStoriesArray.forEach(story => {
            if (currentUser && story.uid === currentUser.uid) {
                userStories.push(story);
            } else {
                otherStories.push(story);
            }
        });

        // Sort user's stories by creation date (newest first)
        userStories.sort((a, b) => {
            const timeA = a.createdAt?.toDate?.() || new Date(0);
            const timeB = b.createdAt?.toDate?.() || new Date(0);
            return timeB - timeA;
        });

        // Sort other stories: unseen first, then seen, with newest first in each group
        otherStories.sort((a, b) => {
            if (a.viewed === b.viewed) {
                const timeA = a.createdAt?.toDate?.() || new Date(0);
                const timeB = b.createdAt?.toDate?.() || new Date(0);
                return timeB - timeA;
            }
            return a.viewed ? 1 : -1;
        });

        // Combine arrays: user's stories first, then others' stories
        storiesArray = [...userStories, ...otherStories];

        // Create story elements for all stories
        storiesArray.forEach((story, index) => {
            const storyElement = document.createElement('div');
            storyElement.className = 'story-item';
            
            // Add viewed styling for other users' stories
            if (currentUser && story.uid !== currentUser.uid && story.viewed) {
                storyElement.style.opacity = '0.7';
            }
            
            let viewersBadge = '';
            if (currentUser && story.uid === currentUser.uid && story.viewersCount > 0) {
                viewersBadge = `
                    <div style="position:absolute; bottom:-5px; right:-5px; background:var(--primary); color:white; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:0.7rem; border:2px solid white;">
                        ${story.viewersCount}
                    </div>
                `;
            }
            
            storyElement.innerHTML = `
                <div class="story-image-container">
                    <img src="${story.mediaUrl}" alt="story" onerror="this.src='https://via.placeholder.com/60'">
                    ${viewersBadge}
                </div>
                <div class="story-username">${currentUser && story.uid === currentUser.uid ? 'Your Story' : (story.author || 'User')}</div>
                <div class="story-timestamp">${getTimeAgo(story.createdAt)}</div>
            `;
            
            storyElement.onclick = (e) => {
                if (e.target.tagName !== 'BUTTON') {
                    // Adjust index because "Your Story" add button is at position 0
                    openStoryViewer(index);
                }
            };
            
            stories.appendChild(storyElement);
        });

        // Reinitialize scroll after stories are loaded
        setTimeout(initializeStoriesScroll, 100);
    }, error => {
        console.error('Error loading stories:', error);
    });
}

    function listenForNotifications() {
  if (!currentUser) return;
  db.collection('notifications')
    .where('receiver', '==', currentUser.uid)
    .orderBy('createdAt', 'desc')
    .limit(50)
    .onSnapshot(snapshot => {
      if (!snapshot || snapshot.empty) {
        notifItems.innerHTML = '<p style="padding:10px;color:#666">No notifications yet</p>';
        notifCount.style.display = 'none';
        return;
      }

      notifItems.innerHTML = '';
      let newCount = 0;
      const now = Date.now();

      snapshot.docChanges().forEach(change => {
        if (change.type === 'added') {
          const n = change.doc.data() || {};
          const notifTime = (n.createdAt && typeof n.createdAt.toMillis === 'function') ? n.createdAt.toMillis() : now;
          // Only play sound for notifications newer than the last one and within the last 5 seconds
          if (notifTime > lastNotifTime && (now - notifTime) < 5000) {
            const activeRecently = (Date.now() - lastActive) < ACTIVITY_TIMEOUT;
            if (audioUnlocked && activeRecently) {
              notifSound.currentTime = 0;
              notifSound.play().catch(() => {});
              if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
                try {
                  new Notification("New Notification", {
                    body: `${n.senderName || 'Someone'} ${n.type.replace('story_', '')} your story`,
                    icon: 'icon.png'
                  });
                } catch (e) {}
              }
            }
            lastNotifTime = notifTime;
          }
        }
      });

      snapshot.forEach(doc => {
        const n = doc.data() || {};
        const item = document.createElement('div');
        item.className = 'notif-item' + (n.read ? '' : ' unread');
        const time = (n.createdAt && typeof n.createdAt.toDate === 'function') ? n.createdAt.toDate().toLocaleString() : '';
        const text = n.type === 'like' ? 'liked your post ❤️' :
                     n.type === 'comment' ? 'commented on your post 💬' :
                     n.type === 'reply' ? 'replied to your comment 💬' :
                     n.type === 'story_view' ? 'viewed your story 👀' :
                     n.type === 'story_reaction' ? `reacted to your story ${n.reaction || ''}` :
                     'started following you 👤';
        item.innerHTML = `<strong>${n.senderName || 'Someone'}</strong> ${text}<br><small style="color:#666">${time}</small>`;
        item.addEventListener('click', async () => {
          try {
            await db.collection('notifications').doc(doc.id).update({ read: true });
          } catch (e) {}
          notifList.style.display = 'none';
          if (n.postId) openPostModal(n.postId, n.commentId || null);
          else if (n.storyId) openStoryViewers(n.storyId);
          else if (n.sender) {
            window.location.href = `user.html?uid=${n.sender}`;
          }
        });
        notifItems.appendChild(item);
        if (!n.read) newCount++;
      });

      if (newCount > 0) {
        notifCount.style.display = 'flex';
        notifCount.textContent = newCount > 99 ? '99+' : newCount;
      } else {
        notifCount.style.display = 'none';
      }
    }, err => console.error('Notification listener error:', err));
}

    function loadFeed() {

    let firstQuery = db.collection('posts').orderBy('createdAt', 'desc').limit(10);

    // Add loading timeout to prevent infinite loading state
    const loadingTimeout = setTimeout(() => {

            feed.innerHTML = `
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Taking longer than expected...</p>

                </div>

    function fetchPosts(query, isInitialLoad = false) {
        if (isFetching) return;
        
        isFetching = true;
        sentinel.textContent = 'Loading posts...';

        query.get().then(snapshot => {
            clearTimeout(loadingTimeout); // Clear timeout on success
            
            if (snapshot.empty) {
                if (isInitialLoad) {
                    feed.innerHTML = `
                        <div class="empty-state">
                            <h3>No posts yet</h3>
                            <p>Be the first to share something!</p>
                        </div>
                    `;
                }
                sentinel.textContent = 'No more posts';
                hasMorePosts = false;
                isFetching = false;
                return;
            }

            // Only clear loading state on initial load
            if (isInitialLoad && feed.querySelector('.loading')) {
                feed.innerHTML = '';
            }

            let postsAdded = 0;
            snapshot.forEach(doc => {
                const p = doc.data();
                const postId = doc.id;
                
                // Skip if post already exists (prevents duplicates)
                if (document.getElementById(`post-${postId}`)) {
                    return;
                }

                const div = document.createElement('div');
                div.className = 'feed-post';
                div.id = `post-${postId}`;

                let mediaHTML = '';
                if (p.mediaUrl) {
                    if (p.mediaType === 'video') {
                        mediaHTML = `<video src="${p.mediaUrl}" controls style="width:100%;border-radius:8px" loading="lazy"></video>`;
                    } else {
                        mediaHTML = `<img src="${p.mediaUrl}" style="width:100%;border-radius:8px" alt="post" loading="lazy">`;
                    }
                    if (p.mediaCaption) {
                        mediaHTML += `<div class="media-caption">${escapeHtml(p.mediaCaption)}</div>`;
                    }
                } else {
                    // Only show "No media" if there's no text either
                    if (!p.text) {
                        mediaHTML = `<div style="padding:18px;border-radius:8px;background:var(--gradient-no-media);text-align:center;font-weight:600;">No media</div>`;
                    }
                }

                let textHTML = '';
                if (p.text) {
                    const bgColor = p.backgroundColor || '#ffffff';
                    textHTML = `<div class="text-post" style="background-color:${bgColor}" onclick="openPostModal('${postId}')">${p.text}</div>`;
                }

                div.innerHTML = `
                    <div class="user">
                        <a href="user.html?uid=${p.uid}">
                            <img src="${p.photoURL || 'https://via.placeholder.com/44'}" alt="${p.author}" loading="lazy">
                            <strong>${p.author}</strong>
                        </a>
                    </div>
                    ${textHTML}
                    <div class="media-wrapper" onclick="openPostModal('${postId}')">
                        ${mediaHTML}
                    </div>
                    <div class="actions">
                        <button id="likeBtn-${postId}" onclick="likePost('${postId}')">
                            <span id="likeIcon-${postId}">🤍</span> 
                            <span id="likeCount-${postId}">${p.likes?.length || 0}</span>
                        </button>
                        <button id="commentBtn-${postId}" onclick="toggleComments('${postId}')">💬 <span id="commentCount-${postId}">0</span></button>
                    </div>
                    <div id="comments-${postId}" class="comments-section" style="display:none">
                        <div class="comments-header"><strong>Comments</strong></div>
                        <div class="comments-list"></div>
                        <div class="comment-input">
                            <input id="newComment-${postId}" placeholder="Write a comment...">
                            <button onclick="sendComment('${postId}')">Send</button>
                        </div>
                    </div>
                `;
                
                feed.appendChild(div);
                loadCommentsCount(postId);
                postsAdded++;

                // Add real-time listener for likes
                const unsub = db.collection('posts').doc(postId).onSnapshot(docSnap => {
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        const likes = data.likes || [];
                        const likeCountEl = document.getElementById(`likeCount-${postId}`);
                        const likeIconEl = document.getElementById(`likeIcon-${postId}`);
                        if (likeCountEl) likeCountEl.textContent = likes.length;
                        if (likeIconEl) {
                            likeIconEl.textContent = currentUser && likes.includes(currentUser.uid) ? '❤️' : '🤍';
                        }
                    }
                }, err => console.error('like listener err', err));
                
                postUnsubs[postId] = postUnsubs[postId] || [];
                postUnsubs[postId].push(unsub);
            });

            // Update lastVisible for pagination
            lastVisible = snapshot.docs[snapshot.docs.length - 1];

            // Handle case where no new posts were added (all duplicates)
            if (isInitialLoad && postsAdded === 0) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <h3>No new posts</h3>
                        <p>Check back later for new content</p>
                    </div>
                `;
            }

            if (snapshot.size < 10) {
                hasMorePosts = false;
                sentinel.textContent = 'No more posts';
            } else {
                sentinel.textContent = 'Scroll to load more';
            }
            isFetching = false;
            
        }).catch(err => {
            console.error('load feed err', err);
            clearTimeout(loadingTimeout);
            
            if (isInitialLoad) {
                feed.innerHTML = `
                    <div class="error-state">
                        <h3>Error loading posts</h3>
                        <p>Please check your connection</p>
                        <button onclick="retryFeedLoad()" class="retry-btn">Try Again</button>
                    </div>
                `;
            }
            sentinel.textContent = 'Error loading posts';
            isFetching = false;
        });
    }

    // Initial fetch
    fetchPosts(firstQuery, true);

    // IntersectionObserver for infinite scroll
    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && hasMorePosts && !isFetching) {
            const nextQuery = db.collection('posts')
                .orderBy('createdAt', 'desc')
                .startAfter(lastVisible)
                .limit(10);
            fetchPosts(nextQuery, false);
        }
    }, { threshold: 0.1 });

    observer.observe(sentinel);

    // Cleanup on page leave
    window.addEventListener('beforeunload', () => {
        Object.keys(postUnsubs).forEach(postId => {
            postUnsubs[postId].forEach(unsub => unsub());
        });
        clearTimeout(loadingTimeout);
    });
}

    function loadCommentsCount(postId) {

    async function sendComment(postId) {
      const input = document.getElementById(`newComment-${postId}`);
      const text = input.value.trim();
      if (!text) return;
      input.disabled = true;
      try {
        const cref = db.collection('posts').doc(postId).collection('comments').doc();
        const user = firebase.auth().currentUser;
        await cref.set({
          uid: user.uid,
          text,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        const postDoc = await db.collection('posts').doc(postId).get();
        const p = postDoc.data();
        const postOwner = p.uid;
        if (postOwner && postOwner !== user.uid) {
          const senderDoc = await db.collection('users').doc(user.uid).get();
          await sendNotification(postOwner, 'comment', postId, senderDoc.exists ? senderDoc.data().fullName : 'Someone');
        }
        input.value = '';
      } catch (e) {
        console.error('add comment err', e);
      } finally {
        input.disabled = false;
      }
    }

    /* ----------------------

       ---------------------- */
    async function likePost(postId) {
      try {
        const ref = db.collection('posts').doc(postId);
        const snap = await ref.get();
        if (!snap.exists) return;
        const data = snap.data();
        const likes = data.likes || [];
        const idx = likes.indexOf(currentUser.uid);
        const already = idx > -1;
        if (already) likes.splice(idx, 1);
        else {
          likes.push(currentUser.uid);
          document.getElementById('likeSound').currentTime = 0;
          document.getElementById('likeSound').play().catch(() => {});
        }
        await ref.update({ likes });
        if (!already && data.uid && data.uid !== currentUser.uid) {
          const senderDoc = await db.collection('users').doc(currentUser.uid).get();
          await sendNotification(data.uid, 'like', postId, senderDoc.exists ? senderDoc.data().fullName : 'Someone');
        }
      } catch (e) {
        console.error('like error', e);
        showToast('Like failed');
      }
    }

    async function sendNotification(receiverId, type, postId = null, senderName = null, commentId = null, storyId = null) {
      const user = firebase.auth().currentUser;
      if (!user || receiverId === user.uid) return;
      senderName = senderName || user.displayName || 'Someone';
      try {
        await db.collection('notifications').add({
          receiver: receiverId,
          sender: user.uid,
          senderName,
          type,
          postId: postId || null,
          commentId: commentId || null,
          storyId: storyId || null,
          read: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (e) {
        console.error('sendNotification error', e);
      }
    }

    /* ----------------------
       User cache
       ---------------------- */
    function listenToUser(uid, callback) {
      if (userCache[uid] && userCache[uid].listener) return;
      const unsub = db.collection('users').doc(uid).onSnapshot(doc => {
        if (!doc.exists) return;
        userCache[uid] = { ...doc.data(), listener: unsub };
        if (callback) callback(userCache[uid]);
      }, err => console.error('user listen err', err));
    }

    async function getUserData(uid) {
      if (userCache[uid]) return userCache[uid];
      try {
        const doc = await db.collection('users').doc(uid).get();
        if (doc.exists) {
          userCache[uid] = doc.data();
          return doc.data();
        }
        return null;
      } catch (e) {
        console.error(e);
        return null;
      }
    }

       ---------------------- */

      if (!user) {

  <script>
  

  async function updateVisitorStats() {
    const statsRef = db.collection('visitors').doc('stats');
    const today = new Date().toISOString().split('T')[0];

    try {
      await db.runTransaction(async (t) => {
        const doc = await t.get(statsRef);
        let data = doc.exists ? doc.data() : { total: 0, daily: {}, lastUpdated: "" };

        if (!data.daily) data.daily = {};
        data.daily[today] = (data.daily[today] || 0) + 1;
        data.total = (data.total || 0) + 1;
        data.lastUpdated = new Date().toLocaleString();

        t.set(statsRef, data);
      });

      console.log("✅ Visitor stats updated successfully.");
    } catch (error) {
      console.error("❌ Error updating visitor stats:", error);
    }
  }

  if (!sessionStorage.getItem("visited_today")) {
    updateVisitorStats();
    sessionStorage.setItem("visited_today", "true");
  }
</script>

  
</body>
