<!-- Initial ad load -->
<script async data-cfasync="false"
  src="//pl28025813.effectivegatecpm.com/7cef91039495f3a458e8dcd12beb2c56/invoke.js"></script>

<script>
  const adBox = document.getElementById('ad-box');
  const adContainer = document.getElementById('container-7cef91039495f3a458e8dcd12beb2c56');
  const closeAd = document.getElementById('closeAd');

  // Hide ad when user closes it
  closeAd.onclick = () => {
    adBox.classList.add('hidden');
    localStorage.setItem('adClosed', 'true');
  };

  // Reload ad script safely
  function reloadAd() {
    adContainer.innerHTML = ''; // remove old ad
    const script = document.createElement('script');
    script.async = true;
    script.dataset.cfasync = "false";
    script.src = "//pl28025813.effectivegatecpm.com/7cef91039495f3a458e8dcd12beb2c56/invoke.js";
    adContainer.appendChild(script);
  }

  let lastReloadTime = 0;
  const reloadDelay = 10000; // 10 seconds minimum between ad reloads

  // Detect when a new video becomes visible
  const videos = document.querySelectorAll('video');

  const observer = new IntersectionObserver(
    entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const now = Date.now();
          // Only reload ad if 10s have passed since last reload
          if (now - lastReloadTime > reloadDelay) {
            lastReloadTime = now;
            if (!localStorage.getItem('adClosed')) {
              adBox.classList.remove('hidden');
              reloadAd();
            }
          }
        }
      });
    },
    { threshold: 0.75 } // triggers when 75% of a video is visible
  );

  videos.forEach(video => observer.observe(video));
</script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD9dwHPDTJr1-mFXPW_JZnVS-JyZ6BNMgU",
  authDomain: "smart-waste-66279.firebaseapp.com",
  projectId: "smart-waste-66279",
  storageBucket: "smart-waste-66279.appspot.com",
  messagingSenderId: "619099585646",
  appId: "1:619099585646:web:b193d2a9fc13347d88ba7f"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const feed = document.getElementById("videoFeed");
const searchInput = document.getElementById("searchInput");
const addBtn = document.getElementById("addBtn");
const uploadModal = document.getElementById("uploadModal");
const closeUpload = document.getElementById("closeUpload");
const uploadOptions = document.querySelectorAll(".upload-option");
const uploadArea = document.getElementById("uploadArea");
const fileInput = document.getElementById("fileInput");
const previewContainer = document.getElementById("previewContainer");
const previewContent = document.getElementById("previewContent");
const captionInput = document.getElementById("captionInput");
const uploadBtn = document.getElementById("uploadBtn");
const progressContainer = document.getElementById("progressContainer");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");

let allVideos = [];
let currentVideoIndex = 0;
let currentMediaType = "image";
let selectedFile = null;
let currentUser = null; // Track current user

// 🔐 Initialize authentication state
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    // Fetch additional user data from Firestore if needed
    const userDoc = await db.collection("users").doc(user.uid).get();
    if (userDoc.exists) {
      const userData = userDoc.data();
      currentUser = { ...user, ...userData };
    }
    loadFeed();
  } else {
    // Redirect to login if not authenticated
    window.location.href = "login.html";
  }
});

// Upload functionality
addBtn.addEventListener("click", () => {
  uploadModal.classList.add("active");
});

closeUpload.addEventListener("click", () => {
  uploadModal.classList.remove("active");
  resetUploadForm();
});

// Switch between image and video upload
uploadOptions.forEach(option => {
  option.addEventListener("click", () => {
    uploadOptions.forEach(opt => opt.classList.remove("active"));
    option.classList.add("active");
    currentMediaType = option.dataset.type;
    
    // Update file input accept attribute
    if (currentMediaType === "image") {
      fileInput.setAttribute("accept", "image/*");
    } else {
      fileInput.setAttribute("accept", "video/*");
    }
    
    // Reset preview if file type doesn't match
    if (selectedFile) {
      const fileType = selectedFile.type.split("/")[0];
      if (fileType !== currentMediaType) {
        resetPreview();
      }
    }
  });
});

// File selection via click
uploadArea.addEventListener("click", () => {
  fileInput.click();
});

// File selection via drag and drop
uploadArea.addEventListener("dragover", (e) => {
  e.preventDefault();
  uploadArea.classList.add("dragover");
});

uploadArea.addEventListener("dragleave", () => {
  uploadArea.classList.remove("dragover");
});

uploadArea.addEventListener("drop", (e) => {
  e.preventDefault();
  uploadArea.classList.remove("dragover");
  
  if (e.dataTransfer.files.length) {
    handleFileSelect(e.dataTransfer.files[0]);
  }
});

// File input change
fileInput.addEventListener("change", (e) => {
  if (e.target.files.length) {
    handleFileSelect(e.target.files[0]);
  }
});

// Handle file selection
function handleFileSelect(file) {
  const fileType = file.type.split("/")[0];
  
  // Check if file type matches selected option
  if (fileType !== currentMediaType) {
    alert(`Please select a ${currentMediaType} file`);
    return;
  }
  
  selectedFile = file;
  
  // Show preview
  const reader = new FileReader();
  reader.onload = (e) => {
    previewContainer.classList.add("active");
    
    if (currentMediaType === "image") {
      previewContent.innerHTML = `<img src="${e.target.result}" class="preview-image" alt="Preview">`;
    } else {
      previewContent.innerHTML = `<video src="${e.target.result}" class="preview-video" controls></video>`;
    }
    
    // Enable upload button
    uploadBtn.disabled = false;
  };
  
  reader.readAsDataURL(file);
}

// Reset upload form
function resetUploadForm() {
  selectedFile = null;
  previewContainer.classList.remove("active");
  previewContent.innerHTML = "";
  captionInput.value = "";
  uploadBtn.disabled = true;
  progressContainer.classList.remove("active");
  progressFill.style.width = "0%";
}

// Reset preview
function resetPreview() {
  selectedFile = null;
  previewContainer.classList.remove("active");
  previewContent.innerHTML = "";
  uploadBtn.disabled = true;
}

// Upload to ImgBB (for images)
async function uploadToImgBB(file) {
  const apiKey = "your_imgbb_api_key_here"; // Replace with your actual ImgBB API key
  
  const formData = new FormData();
  formData.append("key", apiKey);
  formData.append("image", file);
  
  try {
    const response = await fetch("https://api.imgbb.com/1/upload", {
      method: "POST",
      body: formData
    });
    
    const data = await response.json();
    
    if (data.success) {
      return data.data.url;
    } else {
      throw new Error("ImgBB upload failed");
    }
  } catch (error) {
    console.error("Error uploading to ImgBB:", error);
    throw error;
  }
}

// Upload to Cloudinary (for videos)
async function uploadToCloudinary(file) {
  const cloudName = "dm9c4ksdg"; // Replace with your Cloudinary cloud name
  const uploadPreset = "bettke"; // Replace with your Cloudinary upload preset
  
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", uploadPreset);
  
  try {
    const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, {
      method: "POST",
      body: formData
    });
    
    const data = await response.json();
    
    if (data.secure_url) {
      return data.secure_url;
    } else {
      throw new Error("Cloudinary upload failed");
    }
  } catch (error) {
    console.error("Error uploading to Cloudinary:", error);
    throw error;
  }
}

// Upload button click
uploadBtn.addEventListener("click", async () => {
  if (!selectedFile || !currentUser) return;
  
  // Show progress
  progressContainer.classList.add("active");
  uploadBtn.disabled = true;
  
  try {
    let mediaUrl;
    
    // Simulate upload progress
    let progress = 0;
    const progressInterval = setInterval(() => {
      progress += 5;
      progressFill.style.width = `${progress}%`;
      progressText.textContent = `Uploading... ${progress}%`;
      
      if (progress >= 90) {
        clearInterval(progressInterval);
      }
    }, 100);
    
    // Upload based on media type
    if (currentMediaType === "image") {
      mediaUrl = await uploadToImgBB(selectedFile);
    } else {
      mediaUrl = await uploadToCloudinary(selectedFile);
    }
    
    // Complete progress
    clearInterval(progressInterval);
    progressFill.style.width = "100%";
    progressText.textContent = "Processing...";
    
    // ✅ FIX: Use actual current user data instead of hardcoded values
    const postData = {
      url: mediaUrl,
      type: currentMediaType,
      caption: captionInput.value,
      userId: currentUser.uid,
      userName: currentUser.displayName || currentUser.email?.split('@')[0] || "User",
      userPhoto: currentUser.photoURL || "https://i.imgur.com/0y8Ftya.png",
      likes: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    await db.collection("videos").add(postData);
    
    // Update progress text
    progressText.textContent = "Upload complete!";
    
    // Close modal and reset form after a delay
    setTimeout(() => {
      uploadModal.classList.remove("active");
      resetUploadForm();
      loadFeed(); // Reload feed to show new content
    }, 1000);
    
  } catch (error) {
    console.error("Upload error:", error);
    progressText.textContent = "Upload failed. Please try again.";
    uploadBtn.disabled = false;
  }
});

// 🔄 Always fetch latest user profile
async function fetchUser(uid) {
  try {
    const userDoc = await db.collection("users").doc(uid).get();
    if (userDoc.exists) {
      const userData = userDoc.data();
      return {
        displayName: userData.displayName || userData.username || "User",
        photoURL: userData.photoURL || userData.profilePicture || "https://i.imgur.com/0y8Ftya.png"
      };
    }
    return null;
  } catch {
    return null;
  }
}

// 🎬 Load feed with live user profiles
async function loadFeed() {
  feed.innerHTML = `<p style="text-align:center;color:gray;">Loading...</p>`;
  const snapshot = await db.collection("videos").orderBy("createdAt", "desc").get();
  allVideos = [];

  for (const doc of snapshot.docs) {
    const data = doc.data();
    const id = doc.id;
    const latestUser = await fetchUser(data.userId);

    allVideos.push({
      id,
      ...data,
      userName: latestUser?.displayName || data.userName || "User",
      userPhoto: latestUser?.photoURL || data.userPhoto || "https://i.imgur.com/0y8Ftya.png",
    });
  }

  renderFeed(allVideos);
}

// 🧩 Render Feed
function renderFeed(videos) {
  feed.innerHTML = "";
  videos.forEach((data, index) => {
    const id = data.id;
    const card = document.createElement("div");
    card.className = "media-card";
    card.dataset.index = index;

    const mediaElement =
      data.type === "image"
        ? `<img src="${data.url}" alt="post">`
        : `
          <div class="loading-indicator">Loading video...</div>
          <video 
            src="${data.url}" 
            preload="metadata" 
            playsinline 
            loop
            data-loaded="false"
            data-playing="false"
          ></video>
        `;

    card.innerHTML = `
      ${mediaElement}
      <div class="overlay">
        <div class="caption">${data.caption || ""}</div>
      </div>

      <div class="controls">
        <!-- ✅ FIX: Added data-user-id attribute and made profile clickable -->
        <img src="${data.userPhoto}" class="user-profile-icon" title="@${data.userName}" data-user-id="${data.userId}">
        <button class="pause-btn">⏸️</button>
        <button class="download-btn">📥</button>
        <button class="share-btn">🔗</button>
        <button class="comment-btn">💬</button>
      </div>

      <div class="like-btn" data-id="${id}" data-likes="${data.likes || 0}">
        ❤️
        <span class="like-count">${data.likes || 0}</span>
      </div>

      <!-- Enhanced Comments Panel -->
      <div class="comments-panel" id="comments-${id}">
        <div class="comments-header">
          <div class="comments-title">Comments</div>
          <button class="close-comments">×</button>
        </div>
        <div class="comments-list" id="comments-list-${id}">
          <div class="loading-comments">Loading comments...</div>
        </div>
        <div class="comment-input-container">
          <input type="text" class="comment-input" placeholder="Add a comment...">
          <button class="send-comment">➤</button>
        </div>
      </div>
    `;
    feed.appendChild(card);
  });

  attachEvents();
  setupVideoPlayback();
}

// Setup video playback with intersection observer
function setupVideoPlayback() {
  // Create intersection observer to play videos when they're in view
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target.querySelector('video');
      if (!video) return;
      
      if (entry.isIntersecting) {
        // Play the video when it's in view
        playVideo(video);
      } else {
        // Pause the video when it's out of view
        pauseVideo(video);
      }
    });
  }, {
    threshold: 0.7 // Play when 70% of the video is visible
  });

  // Observe all media cards with videos
  document.querySelectorAll('.media-card').forEach(card => {
    if (card.querySelector('video')) {
      observer.observe(card);
    }
  });
}

// Play video with proper error handling
function playVideo(video) {
  if (!video || video.dataset.playing === "true") return;
  
  video.dataset.playing = "true";
  
  // Remove loading indicator if it exists
  const loadingIndicator = video.parentElement.querySelector('.loading-indicator');
  if (loadingIndicator) {
    loadingIndicator.style.display = 'none';
  }
  
  const playPromise = video.play();
  
  if (playPromise !== undefined) {
    playPromise
      .then(() => {
        // Video started playing successfully
        console.log('Video is playing');
      })
      .catch(error => {
        console.error('Error playing video:', error);
        video.dataset.playing = "false";
        
        // Show play button if autoplay failed
        const pauseBtn = video.closest('.media-card').querySelector('.pause-btn');
        if (pauseBtn) {
          pauseBtn.textContent = "▶️";
        }
      });
  }
}

// Pause video
function pauseVideo(video) {
  if (!video) return;
  
  video.pause();
  video.dataset.playing = "false";
}

// 🎛 Event Handlers (pause, like, share, comments)
function attachEvents() {
  // ✅ FIX: Added user profile click handler to redirect to user.html
  document.querySelectorAll(".user-profile-icon").forEach(icon => {
    icon.onclick = (e) => {
      e.stopPropagation();
      const userId = icon.dataset.userId;
      if (userId) {
        window.location.href = `user.html?uid=${userId}`;
      }
    };
  });

  // Comment button - open comments panel
  document.querySelectorAll(".comment-btn").forEach((btn) => {
    btn.onclick = () => {
      const card = btn.closest(".media-card");
      const id = card.querySelector(".like-btn").dataset.id;
      const commentsPanel = card.querySelector(`#comments-${id}`);
      commentsPanel.classList.add("active");
      
      // Load comments when panel opens
      loadComments(id, commentsPanel.querySelector('.comments-list'));
    };
  });

  // Close comments panel
  document.querySelectorAll(".close-comments").forEach((btn) => {
    btn.onclick = () => {
      const commentsPanel = btn.closest(".comments-panel");
      commentsPanel.classList.remove("active");
    };
  });

  // Send comment
  document.querySelectorAll(".send-comment").forEach((btn) => {
    btn.onclick = () => {
      const input = btn.parentElement.querySelector('.comment-input');
      const card = btn.closest(".media-card");
      const id = card.querySelector(".like-btn").dataset.id;
      const commentsList = card.querySelector(`#comments-list-${id}`);
      
      if (input.value.trim()) {
        postComment(id, input.value.trim(), commentsList, null);
        input.value = "";
      }
    };
  });

  // Enter key to send comment
  document.querySelectorAll(".comment-input").forEach((input) => {
    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        const btn = input.parentElement.querySelector('.send-comment');
        btn.click();
      }
    });
  });

  document.querySelectorAll(".like-btn").forEach((btn) => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const current = parseInt(btn.dataset.likes);
      const liked = btn.classList.toggle("liked");
      const newLikes = liked ? current + 1 : current - 1;
      btn.innerHTML = `❤️ <span class="like-count">${newLikes}</span>`;
      btn.dataset.likes = newLikes;
      await db.collection("videos").doc(id).update({ likes: newLikes });
    };
  });

  document.querySelectorAll(".media-card").forEach((card) => {
    const video = card.querySelector("video");
    if (!video) return;
    
    const pauseBtn = card.querySelector(".pause-btn");
    const downloadBtn = card.querySelector(".download-btn");
    const shareBtn = card.querySelector(".share-btn");

    // Handle video loading
    video.addEventListener('loadeddata', () => {
      video.dataset.loaded = "true";
      const loadingIndicator = card.querySelector('.loading-indicator');
      if (loadingIndicator) {
        loadingIndicator.style.display = 'none';
      }
    });

    // Handle video errors
    video.addEventListener('error', () => {
      console.error('Error loading video:', video.src);
      const loadingIndicator = card.querySelector('.loading-indicator');
      if (loadingIndicator) {
        loadingIndicator.textContent = 'Error loading video';
      }
    });

    pauseBtn.onclick = () => {
      if (video.paused) {
        playVideo(video);
        pauseBtn.textContent = "⏸️";
      } else {
        pauseVideo(video);
        pauseBtn.textContent = "▶️";
      }
    };

    downloadBtn.onclick = () => {
      const a = document.createElement("a");
      a.href = video.src;
      a.download = "video.mp4";
      a.click();
    };

    shareBtn.onclick = async () => {
      if (navigator.share) {
        await navigator.share({ title: "Watch this!", url: video.src });
      } else {
        prompt("Copy this link:", video.src);
      }
    };
  });
}

// 💬 Load Comments
async function loadComments(videoId, container) {
  try {
    const snap = await db.collection("videos").doc(videoId).collection("comments").orderBy("createdAt", "asc").get();
    
    if (snap.empty) {
      container.innerHTML = '<div class="no-comments">No comments yet. Be the first to comment!</div>';
      return;
    }
    
    container.innerHTML = '';
    
    for (const doc of snap.docs) {
      const data = doc.data();
      const commentId = doc.id;
      const timeAgo = getTimeAgo(data.createdAt?.toDate() || new Date());
      
      const commentEl = document.createElement('div');
      commentEl.className = 'comment';
      commentEl.innerHTML = `
        <!-- ✅ FIX: Make comment avatar clickable to user profile -->
        <img src="${data.userPhoto || 'https://i.imgur.com/0y8Ftya.png'}" class="comment-avatar" alt="User" data-user-id="${data.userId}" style="cursor:pointer;">
        <div class="comment-content">
          <div class="comment-author" data-user-id="${data.userId}" style="cursor:pointer;">${data.userName || 'User'}</div>
          <div class="comment-text">${data.text}</div>
          <div class="comment-time">${timeAgo}</div>
          <div class="comment-actions">
            <button class="comment-action reply-btn" data-comment-id="${commentId}">Reply</button>
            <button class="comment-action like-btn">Like</button>
          </div>
        </div>
      `;
      
      container.appendChild(commentEl);
      
      // ✅ FIX: Add click handlers for comment user avatars and names
      const commentAvatar = commentEl.querySelector('.comment-avatar');
      const commentAuthor = commentEl.querySelector('.comment-author');
      
      [commentAvatar, commentAuthor].forEach(element => {
        element.addEventListener('click', (e) => {
          e.stopPropagation();
          const userId = element.dataset.userId;
          if (userId) {
            window.location.href = `user.html?uid=${userId}`;
          }
        });
      });
      
      // Add event listener for reply button
      const replyBtn = commentEl.querySelector('.reply-btn');
      replyBtn.addEventListener('click', () => {
        // Remove any existing reply input
        const existingInput = commentEl.querySelector('.reply-input-container');
        if (existingInput) {
          existingInput.remove();
          return;
        }
        
        // Create reply input
        const replyInput = document.createElement('div');
        replyInput.className = 'reply-input-container';
        replyInput.innerHTML = `
          <input type="text" class="reply-input" placeholder="Write a reply...">
          <button class="send-reply">➤</button>
        `;
        
        commentEl.appendChild(replyInput);
        
        // Focus on the input
        const inputField = replyInput.querySelector('.reply-input');
        inputField.focus();
        
        // Send reply on button click
        const sendBtn = replyInput.querySelector('.send-reply');
        sendBtn.addEventListener('click', () => {
          if (inputField.value.trim()) {
            postComment(videoId, inputField.value.trim(), container, commentId);
            replyInput.remove();
          }
        });
        
        // Send reply on Enter key
        inputField.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            sendBtn.click();
          }
        });
      });
      
      // Load replies for this comment
      await loadReplies(videoId, commentId, commentEl);
    }
  } catch (error) {
    console.error("Error loading comments:", error);
    container.innerHTML = '<div class="error-comments">Error loading comments</div>';
  }
}

// 💬 Load Replies for a Comment
async function loadReplies(videoId, commentId, commentElement) {
  try {
    const repliesSnap = await db.collection("videos").doc(videoId)
      .collection("comments").doc(commentId)
      .collection("replies").orderBy("createdAt", "asc").get();
    
    if (!repliesSnap.empty) {
      const repliesContainer = document.createElement('div');
      repliesContainer.className = 'replies-container';
      
      repliesSnap.docs.forEach(doc => {
        const replyData = doc.data();
        const timeAgo = getTimeAgo(replyData.createdAt?.toDate() || new Date());
        
        const replyEl = document.createElement('div');
        replyEl.className = 'reply';
        replyEl.innerHTML = `
          <div class="comment">
            <img src="${replyData.userPhoto || 'https://i.imgur.com/0y8Ftya.png'}" class="comment-avatar" alt="User" data-user-id="${replyData.userId}" style="cursor:pointer;">
            <div class="comment-content">
              <div class="comment-author" data-user-id="${replyData.userId}" style="cursor:pointer;">${replyData.userName || 'User'}</div>
              <div class="comment-text">${replyData.text}</div>
              <div class="comment-time">${timeAgo}</div>
            </div>
          </div>
        `;
        
        repliesContainer.appendChild(replyEl);
        
        // ✅ FIX: Add click handlers for reply user avatars and names
        const replyAvatar = replyEl.querySelector('.comment-avatar');
        const replyAuthor = replyEl.querySelector('.comment-author');
        
        [replyAvatar, replyAuthor].forEach(element => {
          element.addEventListener('click', (e) => {
            e.stopPropagation();
            const userId = element.dataset.userId;
            if (userId) {
              window.location.href = `user.html?uid=${userId}`;
            }
          });
        });
      });
      
      commentElement.appendChild(repliesContainer);
    }
  } catch (error) {
    console.error("Error loading replies:", error);
  }
}

// 💬 Post Comment or Reply
async function postComment(videoId, text, container, parentCommentId = null) {
  try {
    if (!currentUser) {
      alert("Please log in to comment");
      return;
    }
    
    // ✅ FIX: Use actual current user data
    const commentData = {
      text: text,
      userName: currentUser.displayName || currentUser.email?.split('@')[0] || "User",
      userPhoto: currentUser.photoURL || "https://i.imgur.com/0y8Ftya.png",
      userId: currentUser.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    if (parentCommentId) {
      // This is a reply to a comment
      await db.collection("videos").doc(videoId)
        .collection("comments").doc(parentCommentId)
        .collection("replies").add(commentData);
    } else {
      // This is a top-level comment
      await db.collection("videos").doc(videoId)
        .collection("comments").add(commentData);
    }
    
    // Reload comments to show the new one
    loadComments(videoId, container);
  } catch (error) {
    console.error("Error posting comment:", error);
    alert("Failed to post comment. Please try again.");
  }
}

// Utility function to format time
function getTimeAgo(date) {
  const now = new Date();
  const diffMs = now - date;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMs / 3600000);
  const diffDays = Math.floor(diffMs / 86400000);
  
  if (diffMins < 1) return "Just now";
  if (diffMins < 60) return `${diffMins}m ago`;
  if (diffHours < 24) return `${diffHours}h ago`;
  if (diffDays < 7) return `${diffDays}d ago`;
  
  return date.toLocaleDateString();
}

// 🔍 Search by caption or username
searchInput.addEventListener("input", (e) => {
  const q = e.target.value.toLowerCase();
  const filtered = allVideos.filter(
    (v) =>
      v.caption?.toLowerCase().includes(q) ||
      v.userName?.toLowerCase().includes(q)
  );
  renderFeed(filtered);
});
